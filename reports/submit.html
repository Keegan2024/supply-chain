<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Report — SupplyNC</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .report-period-bar { background:var(--blue-900); color:#fff; border-radius:var(--radius-md); padding:16px 22px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .report-period-bar .period-label { font-size:.72rem; opacity:.6; text-transform:uppercase; letter-spacing:.7px; }
    .report-period-bar .period-val   { font-size:1.1rem; font-weight:700; }
    .rpt-table { width:100%; border-collapse:collapse; font-size:.82rem; }
    .rpt-table th { background:var(--blue-900); color:rgba(255,255,255,.85); font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px; padding:10px 12px; text-align:left; white-space:nowrap; }
    .rpt-table td { padding:8px 10px; border-bottom:1px solid var(--slate-100); vertical-align:middle; }
    .rpt-table tr:last-child td { border-bottom:none; }
    .rpt-table tr:hover td { background:var(--slate-50); }
    .mini-input { width:80px; padding:5px 7px; border:1px solid var(--slate-300); border-radius:var(--radius-sm); font-size:.82rem; text-align:center; }
    .mini-input:focus { outline:none; border-color:var(--blue-500); box-shadow:0 0 0 2px rgba(59,130,196,.15); }
    .mini-input:read-only { background:var(--slate-50); color:var(--slate-500); cursor:default; }
    .closing-cell { font-weight:700; font-size:.95rem; }
    .ok   { color:var(--green-600); }
    .bad  { color:var(--red-600); }
    .col-commodity { min-width:200px; }
    .col-num { width:90px; text-align:center; }
    .section-divider { background:var(--slate-50); }
    .section-divider td { padding:6px 12px; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--slate-500); }
    .download-bar { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; padding-top:16px; border-top:1px solid var(--slate-100); }
    .type-badge { display:inline-flex; align-items:center; gap:5px; background:var(--blue-50); color:var(--blue-700); border:1px solid var(--blue-100); border-radius:99px; padding:3px 10px; font-size:.72rem; font-weight:600; }
  </style>
</head>
<body>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
Auth.requireLogin();
if (!Auth.can('submitReports')) { UI.toast('Access denied.','error'); setTimeout(()=>Auth.redirectToDashboard(),1200); }

const user       = Auth.getUser();
const facilityId = user.facilityId || 'fac_01';
const facility   = DB.getOne('facilities', facilityId) || { name:'My Facility', districtId:'dist_01' };
const windowOpen = DB.isReportWindowOpen(user.id);
const stocks     = DB.getFacilityStockSummary(facilityId);
const commodities= DB.get('commodities');
let isPreview    = false;
let reportType   = 'monthly';

const REPORT_TYPES = [
  { id:'daily',     label:'Daily' },
  { id:'weekly',    label:'Weekly' },
  { id:'monthly',   label:'Monthly' },
  { id:'quarterly', label:'Quarterly' },
  { id:'yearly',    label:'Yearly' }
];

function getPeriodLabel() {
  const now = new Date();
  if (reportType==='daily')     return now.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  if (reportType==='weekly')    { const wk=getWeekNumber(now); return `Week ${wk} — ${now.getFullYear()}`; }
  if (reportType==='monthly')   return now.toLocaleString('default',{month:'long',year:'numeric'});
  if (reportType==='quarterly') { const q=Math.ceil((now.getMonth()+1)/3); return `Q${q} ${now.getFullYear()}`; }
  if (reportType==='yearly')    return `Year ${now.getFullYear()}`;
  return '';
}

function getWeekNumber(d) {
  const s=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-s)/86400000)+s.getDay()+1)/7);
}

function buildPage() {
  const period = getPeriodLabel();
  const existingPending = DB.get('reports').find(r =>
    r.facilityId === facilityId && r.period === period && r.status === 'pending'
  );

  UI.shell('Submit Report', 'submit-report', `
    <div class="d-flex align-center mb-8">
      <button class="btn btn-ghost btn-sm" onclick="history.back()" style="margin-right:8px">← Back</button>
      <h2 class="fw-700" style="font-size:1.05rem">Submit Report</h2>
    </div>

    ${!windowOpen ? `<div class="alert alert-danger"><span class="alert-icon">🔒</span><div><strong>Report window is closed.</strong> Contact your District Manager to request a reopening.</div></div>` : ''}

    ${existingPending ? `<div class="alert alert-warning"><span class="alert-icon">⚠️</span><div><strong>A pending report for ${period} already exists.</strong> <a href="history.html" style="color:var(--amber-600);font-weight:600">View in history →</a></div></div>` : ''}

    <!-- Report Type Selector -->
    <div class="card mb-16">
      <div class="card-body" style="padding:14px 20px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="text-sm fw-600 text-muted">Report Type:</span>
          ${REPORT_TYPES.map(t=>`
            <button class="btn btn-sm ${reportType===t.id?'btn-primary':'btn-outline'}"
              onclick="reportType='${t.id}';buildPage()">${t.label}</button>`).join('')}
        </div>
      </div>
    </div>

    <!-- Period Banner -->
    <div class="report-period-bar">
      <div>
        <div class="period-label">Reporting Period</div>
        <div class="period-val">${period}</div>
      </div>
      <div style="text-align:right">
        <div class="period-label">Facility</div>
        <div style="font-weight:600;font-size:.9rem">${facility.name}</div>
      </div>
      <div><span class="type-badge">📋 ${REPORT_TYPES.find(t=>t.id===reportType).label} Report</span></div>
    </div>

    ${stocks.length === 0
      ? `<div class="card"><div class="card-body"><div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-title">No stock to report</div>
          <div class="empty-desc">Stock is added when deliveries are confirmed from your district.</div>
        </div></div></div>`
      : `
      <!-- Action Bar -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="text-sm text-muted">${stocks.length} commodity line${stocks.length!==1?'s':''}  · Fill any <span style="color:var(--red-600);font-weight:600">Damaged/Lost</span> fields if applicable.</div>
        <div style="display:flex;gap:8px">
          ${windowOpen && !existingPending ? `
            <button class="btn btn-outline btn-sm" onclick="downloadTemplate('excel')" title="Download blank Excel template">⬇ Excel Template</button>
            <button class="btn btn-outline btn-sm" onclick="downloadTemplate('pdf')" title="Download blank PDF template">⬇ PDF Template</button>
            ${isPreview
              ? `<button class="btn btn-outline btn-sm" onclick="isPreview=false;buildPage()">✏️ Edit</button>
                 <button class="btn btn-outline btn-sm" onclick="downloadReport()">⬇ Download Report</button>
                 <button class="btn btn-primary btn-sm" id="btn-submit" onclick="submitReport()">📤 Submit Report</button>`
              : `<button class="btn btn-teal btn-sm" id="btn-preview" onclick="doPreview()">👁 Preview & Review</button>`
            }
          ` : ''}
        </div>
      </div>

      <!-- Report Table -->
      <div class="card" id="report-card">
        <div class="table-wrapper">
          <table class="rpt-table" id="rpt-table">
            <thead>
              <tr>
                <th class="col-commodity">Commodity</th>
                <th class="col-num">Unit</th>
                <th class="col-num" title="Stock at start of period">Opening<br>Balance</th>
                <th class="col-num" style="background:var(--teal-600)" title="Auto: from confirmed deliveries">Received</th>
                <th class="col-num" style="background:var(--teal-600)" title="Auto: from dispense records">Dispensed/<br>Consumed</th>
                <th class="col-num" style="background:var(--teal-600)" title="Auto: commodities shared to other facilities">Given<br>Away</th>
                <th class="col-num" style="background:#7c3aed" title="Auto: system-flagged expired items">Expired</th>
                <th class="col-num" style="background:var(--red-600)" title="Manual entry only">Damaged/<br>Lost</th>
                <th class="col-num" style="background:var(--blue-800)">Closing<br>Balance</th>
                <th class="col-num">Status</th>
              </tr>
            </thead>
            <tbody id="rpt-body">
              ${stocks.map((s,i) => buildRow(s,i)).join('')}
            </tbody>
          </table>
        </div>
        ${isPreview ? `
        <div class="download-bar" style="padding:16px 20px">
          <span class="text-sm text-muted">Report ready — download a copy:</span>
          <button class="btn btn-outline btn-sm" onclick="downloadReport('pdf')">⬇ PDF Report</button>
          <button class="btn btn-outline btn-sm" onclick="downloadReport('excel')">⬇ Excel Report</button>
        </div>` : ''}
      </div>

      <div class="alert alert-info mt-16">
        <span class="alert-icon">ℹ️</span>
        <div><strong>Auto-populated fields</strong> (shaded) are pulled from system records — deliveries, dispenses, shares and expired items. Only <strong>Damaged/Lost</strong> requires manual input. The system prevents negative balances.</div>
      </div>
    `}
  `);

  if (stocks.length > 0) {
    document.querySelectorAll('.damaged-input').forEach(inp => {
      inp.addEventListener('input', () => recalcRow(inp.closest('tr')));
    });
  }
}

function buildRow(s, i) {
  const com    = DB.getOne('commodities', s.commodityId);
  const today  = new Date();
  const expDate= s.expiryDate ? new Date(s.expiryDate) : null;
  const isExp  = expDate && expDate < today;
  const autoExpired = isExp ? s.closingBalance : 0;

  // Auto-populate from system records
  const opening  = s.openingBalance || 0;
  const received = s.received || 0;
  const consumed = s.consumed || 0;
  const giveaway = s.givenAway || 0;
  const expired  = s.expired || autoExpired;
  const closing  = opening + received - consumed - giveaway - expired;

  const isLow = com && s.closingBalance < (com.minThreshold || 0);

  const readonlyAttr = isPreview ? 'readonly' : '';
  const disabledAttr = isPreview ? 'disabled' : '';

  return `<tr data-commodity="${s.commodityId}" data-opening="${opening}" data-received="${received}" data-consumed="${consumed}" data-giveaway="${giveaway}" data-expired="${expired}">
    <td class="col-commodity">
      <div class="fw-600" style="font-size:.83rem">${escHtml(DB.getCommodityName(s.commodityId))}</div>
      ${s.batchNo ? `<div class="text-xs text-muted td-mono">Batch: ${s.batchNo}</div>` : ''}
      ${s.expiryDate ? `<div class="text-xs ${isExp?'text-danger':'text-muted'}">Exp: ${formatDate(s.expiryDate)}${isExp?' ⚠️':''}</div>` : ''}
      ${isLow ? '<div class="text-xs text-danger">⚠ Low stock</div>' : ''}
    </td>
    <td class="col-num text-muted" style="text-align:center">${com?.unit||'—'}</td>
    <td class="col-num" style="text-align:center;font-weight:600">${opening}</td>
    <td class="col-num" style="text-align:center;background:rgba(13,148,136,.06);color:var(--teal-600);font-weight:600">${received}</td>
    <td class="col-num" style="text-align:center;background:rgba(13,148,136,.06);color:var(--teal-600);font-weight:600">${consumed}</td>
    <td class="col-num" style="text-align:center;background:rgba(13,148,136,.06);color:var(--teal-600);font-weight:600">${giveaway}</td>
    <td class="col-num" style="text-align:center;background:rgba(124,58,237,.06);color:#7c3aed;font-weight:600">${expired}</td>
    <td class="col-num" style="text-align:center">
      <input type="number" class="mini-input damaged-input" value="0" min="0" data-commodity="${s.commodityId}" ${disabledAttr}
        style="border-color:var(--red-600);${isPreview?'background:var(--slate-50);color:var(--slate-500);':''}">
    </td>
    <td class="col-num" style="text-align:center;background:rgba(37,99,168,.06)">
      <span class="closing-cell ${closing<0?'bad':'ok'}" id="closing-${s.commodityId}">${closing}</span>
    </td>
    <td class="col-num" style="text-align:center">
      <span id="val-${s.commodityId}" class="${closing<0?'badge badge-red':'badge badge-green'}">${closing<0?'✗ Error':'✓ OK'}</span>
    </td>
  </tr>`;
}

function recalcRow(row) {
  const comId    = row.dataset.commodity;
  const opening  = parseInt(row.dataset.opening)  || 0;
  const received = parseInt(row.dataset.received)  || 0;
  const consumed = parseInt(row.dataset.consumed)  || 0;
  const giveaway = parseInt(row.dataset.giveaway)  || 0;
  const expired  = parseInt(row.dataset.expired)   || 0;
  const damaged  = parseInt(row.querySelector('.damaged-input').value) || 0;
  const closing  = opening + received - consumed - giveaway - expired - damaged;

  const closingEl = document.getElementById('closing-' + comId);
  const valEl     = document.getElementById('val-' + comId);
  if (!closingEl) return;

  closingEl.textContent = closing;
  closingEl.className   = 'closing-cell ' + (closing < 0 ? 'bad' : 'ok');
  valEl.className       = closing < 0 ? 'badge badge-red' : 'badge badge-green';
  valEl.textContent     = closing < 0 ? '✗ Error' : '✓ OK';
}

function doPreview() {
  const errors = document.querySelectorAll('.badge-red');
  if (errors.length) { UI.toast('Fix all errors before previewing.', 'error'); return; }
  isPreview = true;
  buildPage();
  UI.toast('Review your report carefully, then click Submit.', 'default', 4000);
}

function collectItems() {
  return stocks.map(s => {
    const row      = document.querySelector(`tr[data-commodity="${s.commodityId}"]`);
    const opening  = parseInt(row?.dataset.opening)  || 0;
    const received = parseInt(row?.dataset.received)  || 0;
    const consumed = parseInt(row?.dataset.consumed)  || 0;
    const giveaway = parseInt(row?.dataset.giveaway)  || 0;
    const expired  = parseInt(row?.dataset.expired)   || 0;
    const damaged  = parseInt(row?.querySelector('.damaged-input')?.value) || 0;
    const closing  = opening + received - consumed - giveaway - expired - damaged;
    return { commodityId:s.commodityId, openingBalance:opening, received, consumed, givenAway:giveaway, expired, damagedLost:damaged, closingBalance:closing };
  });
}

function submitReport() {
  const items = collectItems();
  if (items.some(i => i.closingBalance < 0)) { UI.toast('Negative balance detected. Cannot submit.', 'error'); return; }
  if (!confirm(`Submit ${REPORT_TYPES.find(t=>t.id===reportType).label} report for ${getPeriodLabel()}?\n\nThis will be sent to your District Manager for review.`)) return;

  const report = {
    id: DB.genId('rpt'),
    submittedBy: user.id,
    facilityId,
    districtId: facility.districtId || 'dist_01',
    period: getPeriodLabel(),
    reportType,
    status: 'pending',
    submittedAt: new Date().toISOString(),
    reviewedBy: null, reviewedAt: null, rejectionReason: null,
    items
  };
  DB.add('reports', report);
  DB.add('auditLog', { id:DB.genId('log'), action:'report_submitted', userId:user.id, details:`${reportType} report submitted for ${getPeriodLabel()}`, timestamp:new Date().toISOString() });

  UI.toast('Report submitted! Confirmation sent. Redirecting…', 'success', 3500);
  setTimeout(() => window.location.href = 'history.html', 2500);
}

function downloadTemplate(format) {
  // Build CSV content for Excel template
  const headers = ['Commodity','Unit','Opening Balance','Received (Auto)','Dispensed/Consumed (Auto)','Given Away (Auto)','Expired (Auto)','Damaged/Lost (Manual)','Closing Balance'];
  const rows    = stocks.map(s => {
    const com = DB.getOne('commodities', s.commodityId);
    return [`"${DB.getCommodityName(s.commodityId)}"`, com?.unit||'', s.openingBalance||0, s.received||0, s.consumed||0, s.givenAway||0, s.expired||0, 0, '=C+D-E-F-G-H'].join(',');
  });
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `SupplyNC_Report_Template_${getPeriodLabel().replace(/ /g,'_')}.csv`;
  a.click();
  UI.toast('Template downloaded.', 'success');
}

function downloadReport() {
  const items  = collectItems();
  const period = getPeriodLabel();
  let html = `<html><head><style>
    body{font-family:Arial,sans-serif;font-size:12px;color:#0f172a}
    h1{font-size:16px;margin-bottom:4px}
    .meta{color:#64748b;margin-bottom:20px;font-size:11px}
    table{width:100%;border-collapse:collapse}
    th{background:#0f2744;color:white;padding:8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
    td{padding:7px 8px;border-bottom:1px solid #e2e8f0}
    tr:nth-child(even) td{background:#f8fafc}
    .ok{color:#16a34a;font-weight:700} .bad{color:#dc2626;font-weight:700}
    .footer{margin-top:30px;font-size:10px;color:#94a3b8}
  </style></head><body>
  <h1>⛓️ SupplyNC — ${REPORT_TYPES.find(t=>t.id===reportType).label} Stock Report</h1>
  <div class="meta">Period: <b>${period}</b> &nbsp;·&nbsp; Facility: <b>${facility.name}</b> &nbsp;·&nbsp; Generated: <b>${new Date().toLocaleString()}</b> &nbsp;·&nbsp; By: <b>${user.name}</b></div>
  <table>
    <thead><tr><th>Commodity</th><th>Unit</th><th>Opening</th><th>Received</th><th>Dispensed</th><th>Given Away</th><th>Expired</th><th>Damaged/Lost</th><th>Closing Balance</th></tr></thead>
    <tbody>
      ${items.map(i=>{
        const com=DB.getOne('commodities',i.commodityId);
        return `<tr>
          <td><b>${DB.getCommodityName(i.commodityId)}</b></td>
          <td>${com?.unit||''}</td><td>${i.openingBalance}</td><td>${i.received}</td>
          <td>${i.consumed}</td><td>${i.givenAway}</td><td>${i.expired}</td><td>${i.damagedLost}</td>
          <td class="${i.closingBalance<0?'bad':'ok'}">${i.closingBalance}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>
  <div class="footer">SupplyNC National Supply Chain Management System · Generated ${new Date().toISOString()}</div>
  </body></html>`;

  const blob = new Blob([html], {type:'text/html'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `SupplyNC_Report_${period.replace(/ /g,'_')}.html`;
  a.click();
  UI.toast('Report downloaded.', 'success');
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDate(iso){ return iso ? new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }

buildPage();
</script>
</body>
</html>
